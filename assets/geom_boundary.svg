<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1120 700" role="img" aria-labelledby="title desc">
<title id="title">凸起硅条的不同表示</title><desc id="desc">同一凸条的二维截面说明三维表示差异：参考边界、点云、分片显式边界、硬标签、体积分数与符号距离。不是仿真结果。</desc>
<defs><pattern id="grid" width="25" height="25" patternUnits="userSpaceOnUse"><path d="M25 0H0V25" fill="none" stroke="#bed0de" stroke-width="1"/></pattern></defs>
<rect width="1120" height="700" rx="18" fill="#f5f8fc"/>
<g font-family="Segoe UI, Microsoft YaHei, sans-serif" fill="#183147">
<text x="30" y="42" font-size="25" font-weight="700">同一根凸硅条：每种表示存下了什么？</text>
<text x="30" y="72" font-size="17" fill="#536d82">图为 X–Z 剖面；三维时沿 Y 还会有形状变化。蓝色表示硅，白色表示空气。</text>
<g transform="translate(25 94)"><rect width="340" height="270" rx="12" fill="white" stroke="#d2dce6"/><text x="18" y="32" font-size="20" font-weight="700">参考轮廓</text><path d="M20 200L99 200Q117 199 122 177L139 95Q142 79 157 79H213Q230 80 235 97L250 176Q253 197 270 200H320V223H20Z" fill="#70acd3"/><path d="M20 200L99 200Q117 199 122 177L139 95Q142 79 157 79H213Q230 80 235 97L250 176Q253 197 270 200H320" fill="none" stroke="#1c628e" stroke-width="3"/><text x="25" y="245" font-size="16">顶部保留，周边刻蚀；有倾斜和圆角</text></g>
<g transform="translate(390 94)"><rect width="340" height="270" rx="12" fill="white" stroke="#d2dce6"/><text x="18" y="32" font-size="20" font-weight="700">点云</text><g fill="#2875a6"><circle cx="20" cy="200" r="4"/><circle cx="43" cy="200" r="4"/><circle cx="66" cy="200" r="4"/><circle cx="89" cy="200" r="4"/><circle cx="110" cy="195" r="4"/><circle cx="121" cy="178" r="4"/><circle cx="126" cy="155" r="4"/><circle cx="131" cy="132" r="4"/><circle cx="136" cy="109" r="4"/><circle cx="143" cy="87" r="4"/><circle cx="165" cy="79" r="4"/><circle cx="188" cy="79" r="4"/><circle cx="211" cy="79" r="4"/><circle cx="232" cy="91" r="4"/><circle cx="239" cy="114" r="4"/><circle cx="244" cy="137" r="4"/><circle cx="248" cy="160" r="4"/><circle cx="253" cy="183" r="4"/><circle cx="269" cy="200" r="4"/><circle cx="294" cy="200" r="4"/><circle cx="319" cy="200" r="4"/></g><text x="26" y="244" font-size="16">有采样点；连接和内部需要补充</text></g>
<g transform="translate(755 94)"><rect width="340" height="270" rx="12" fill="white" stroke="#d2dce6"/><text x="18" y="32" font-size="20" font-weight="700">显式分片边界</text><path d="M20 200H100L120 181L141 90L156 79H214L233 94L252 182L270 200H320V223H20Z" fill="#b1d3e9" stroke="#276f9b" stroke-width="2.5"/><g fill="#165c89"><circle cx="100" cy="200" r="4"/><circle cx="120" cy="181" r="4"/><circle cx="141" cy="90" r="4"/><circle cx="156" cy="79" r="4"/><circle cx="214" cy="79" r="4"/><circle cx="233" cy="94" r="4"/><circle cx="252" cy="182" r="4"/><circle cx="270" cy="200" r="4"/></g><text x="20" y="245" font-size="15">剖面为折线；三维表面由小面片连接</text></g>
<g transform="translate(25 385)"><rect width="340" height="270" rx="12" fill="white" stroke="#d2dce6"/><text x="18" y="32" font-size="20" font-weight="700">硬材料标签</text><path d="M25 200H125V150H150V75H225V100H250V200H325V225H25Z" fill="#70acd3"/><rect x="25" y="50" width="300" height="175" fill="url(#grid)"/><text x="22" y="246" font-size="16">若每格恒定，边界只能沿格面跳变</text></g>
<g transform="translate(390 385)"><rect width="340" height="270" rx="12" fill="white" stroke="#d2dce6"/><text x="18" y="32" font-size="20" font-weight="700">体积分数</text><path d="M25 200H150V100H225V200H325V225H25Z" fill="#70acd3"/><path d="M150 75H225V100H150Z" fill="#89bada"/><path d="M125 100H150V125H125ZM225 100H250V125H225Z" fill="#d1e4f0"/><path d="M125 125H150V175H125ZM225 125H250V175H225Z" fill="#b2d3e8"/><path d="M125 175H150V200H125ZM225 175H250V200H225Z" fill="#81b5d6"/><path d="M100 175H125V200H100ZM250 175H275V200H250Z" fill="#d7e8f3"/><rect x="25" y="50" width="300" height="175" fill="url(#grid)"/><text x="153" y="95" font-size="15" fill="#174c6b">部分硅</text><text x="26" y="246" font-size="16">知道格内比例；还需界面重建规则</text></g>
<g transform="translate(755 385)"><rect width="340" height="270" rx="12" fill="white" stroke="#d2dce6"/><text x="18" y="32" font-size="20" font-weight="700">符号距离函数 SDF</text><path d="M20 200L99 200Q117 199 122 177L139 95Q142 79 157 79H213Q230 80 235 97L250 176Q253 197 270 200H320V223H20Z" fill="#c8e3ee"/><path d="M20 200L99 200Q117 199 122 177L139 95Q142 79 157 79H213Q230 80 235 97L250 176Q253 197 270 200H320" fill="none" stroke="#19678c" stroke-width="3"/><text x="49" y="140" font-size="21" fill="#b37737">φ &gt; 0</text><text x="162" y="159" font-size="21" fill="#216488">φ &lt; 0</text><text x="257" y="98" font-size="18">φ = 0</text><path d="M265 105L237 111" stroke="#536d82" stroke-width="1.5"/><text x="24" y="245" font-size="16">零等值面定义边界；数值表示距离</text></g>
<text x="30" y="685" font-size="15" fill="#607485">概念示意 · 自主绘制 · 不同图的连线、灰度和符号不能直接当成同一份物理输入</text>
</g></svg>
