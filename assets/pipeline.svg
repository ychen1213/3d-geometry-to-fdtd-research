<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="245" viewBox="0 0 1200 245"><title>从工艺文件到位置测量的计算流程</title><rect width="1200" height="245" fill="#f7faf9"/><defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto"><path d="M0,0 L6,3 L0,6" fill="#3b788a"/></marker></defs><rect x="16" y="25" width="216" height="140" rx="9" fill="#e6f0f2" stroke="#aac8d1"/><text x="33" y="62" font-size="19" font-weight="bold" fill="#174e5e">01 工艺数据</text><text x="33" y="99" font-size="15" fill="#355c69">尺寸 / 材料 / 占比</text><text x="33" y="128" font-size="15" fill="#355c69">原始 VDATA 与 wafer</text><path d="M232,95 h20" stroke="#3b788a" stroke-width="2" marker-end="url(#arrow)"/><rect x="254" y="25" width="216" height="140" rx="9" fill="#e6f0f2" stroke="#aac8d1"/><text x="271" y="62" font-size="19" font-weight="bold" fill="#174e5e">02 几何表达</text><text x="271" y="99" font-size="15" fill="#355c69">体素 / 表面 / 隐式场</text><text x="271" y="128" font-size="15" fill="#355c69">单位与坐标必须明确</text><path d="M470,95 h20" stroke="#3b788a" stroke-width="2" marker-end="url(#arrow)"/><rect x="492" y="25" width="216" height="140" rx="9" fill="#e6f0f2" stroke="#aac8d1"/><text x="509" y="62" font-size="19" font-weight="bold" fill="#174e5e">03 材料映射</text><text x="509" y="99" font-size="15" fill="#355c69">查询界面与局部占比</text><text x="509" y="128" font-size="15" fill="#355c69">生成 Yee 更新系数</text><path d="M708,95 h20" stroke="#3b788a" stroke-width="2" marker-end="url(#arrow)"/><rect x="730" y="25" width="216" height="140" rx="9" fill="#e6f0f2" stroke="#aac8d1"/><text x="747" y="62" font-size="19" font-weight="bold" fill="#174e5e">04 电磁求解</text><text x="747" y="99" font-size="15" fill="#355c69">E / H / ADE / PML</text><text x="747" y="128" font-size="15" fill="#355c69">推进时间并记录信号</text><path d="M946,95 h20" stroke="#3b788a" stroke-width="2" marker-end="url(#arrow)"/><rect x="968" y="25" width="216" height="140" rx="9" fill="#e6f0f2" stroke="#aac8d1"/><text x="985" y="62" font-size="19" font-weight="bold" fill="#174e5e">05 位置读出</text><text x="985" y="99" font-size="15" fill="#355c69">参考与估计器</text><text x="985" y="128" font-size="15" fill="#355c69">最终验证 10 nm 目标</text><text x="20" y="211" font-size="16" fill="#546d76">逐级验证：信息是否足够 → 边界是否改变 → 材料映射是否正确 → 电磁结果是否收敛 → 位置读数是否可信</text></svg>